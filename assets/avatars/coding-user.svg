<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <!-- Rounded background -->
  <rect width="512" height="512" rx="120" fill="#00A4EF"/>

  <!-- Laptop body -->
  <rect x="120" y="180" width="272" height="160" rx="15" fill="#0078B8"/>

  <!-- Laptop screen border -->
  <rect x="130" y="190" width="252" height="130" rx="10" fill="#00D4FF"/>

  <!-- Laptop screen display -->
  <rect x="140" y="200" width="232" height="110" rx="5" fill="#001A3A"/>

  <!-- Code brackets on screen - Left bracket < -->
  <text x="160" y="250" font-family="monospace" font-size="48" font-weight="bold" fill="#00FF00">&lt;</text>

  <!-- Code bracket - Right bracket > -->
  <text x="310" y="250" font-family="monospace" font-size="48" font-weight="bold" fill="#00FF00">&gt;</text>

  <!-- Code lines -->
  <line x1="190" y1="220" x2="250" y2="220" stroke="#00FF00" stroke-width="2" opacity="0.8"/>
  <line x1="190" y1="235" x2="320" y2="235" stroke="#00FF00" stroke-width="2" opacity="0.8"/>
  <line x1="190" y1="250" x2="310" y2="250" stroke="#00FF00" stroke-width="2" opacity="0.8"/>
  <line x1="190" y1="265" x2="280" y2="265" stroke="#00FF00" stroke-width="2" opacity="0.8"/>
  <line x1="190" y1="280" x2="300" y2="280" stroke="#00FF00" stroke-width="2" opacity="0.8"/>

  <!-- Laptop keyboard area -->
  <rect x="130" y="330" width="252" height="25" fill="#0078B8" rx="3"/>

  <!-- Keyboard keys (simplified) -->
  <rect x="150" y="335" width="8" height="8" fill="#003D82"/>
  <rect x="165" y="335" width="8" height="8" fill="#003D82"/>
  <rect x="180" y="335" width="8" height="8" fill="#003D82"/>
  <rect x="195" y="335" width="8" height="8" fill="#003D82"/>
  <rect x="210" y="335" width="8" height="8" fill="#003D82"/>
  <rect x="310" y="335" width="8" height="8" fill="#003D82"/>
  <rect x="325" y="335" width="8" height="8" fill="#003D82"/>
  <rect x="340" y="335" width="8" height="8" fill="#003D82"/>

  <!-- Shine effect -->
  <ellipse cx="200" cy="240" rx="30" ry="15" fill="white" opacity="0.15"/>
</svg>