org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

# El compilador incremental de Kotlin relativiza las rutas de los fuentes contra
# el directorio del proyecto. En Windows, si la caché de paquetes de Dart vive en
# otra unidad que el repositorio (p. ej. PUB_CACHE en C:\ y el repo en D:\), esa
# operación lanza `IllegalArgumentException: this and base files have different
# roots` y la build falla al compilar los plugins (url_launcher_android,
# shared_preferences_android...). Desactivarlo evita el problema; el coste es
# nulo en la práctica, porque el código Kotlin que se compila aquí es el de los
# plugins, que no cambia entre builds.
kotlin.incremental=false
